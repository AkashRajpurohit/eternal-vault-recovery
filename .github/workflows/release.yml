name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:tool
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-tool/recover.html
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-tool/recover.html dist-tool/SHA256SUMS dist-tool/recover.json \
            --title "$GITHUB_REF_NAME" \
            --notes "Verify before use: compare \`shasum -a 256 recover.html\` with SHA256SUMS, or run \`gh attestation verify recover.html --repo $GITHUB_REPOSITORY\`."
